# Persistent sshd container for IDE remote access (JetBrains Gateway, VS Code Remote-SSH)
# and for Dev Containers. Prefer `devbox up` over raw `docker compose up`: it fills in
# the host paths below correctly on Windows/WSL/Linux.
services:
  dev:
    image: devbox-base:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devbox-sshd
    init: true
    ports:
      # loopback only; key-based login, no passwords
      - "127.0.0.1:2222:22"
    environment:
      - DEV_UID=${DEV_UID:-1000}
      - DEV_GID=${DEV_GID:-1000}
      # no value: forwarded from the host environment only if it is set there, never written to disk
      - ANTHROPIC_API_KEY
    volumes:
      - ${DEVBOX_PROJECTS_DIR:-./projects}:/work
      - devbox-home:/home/dev
      - devbox-cargo:/home/dev/.cargo
      - devbox-rustup:/usr/local/rustup
      - devbox-go:/home/dev/go
      - devbox-uv-cache:/home/dev/.cache/uv
      - devbox-pnpm-store:/home/dev/.pnpm-store
      # staging mount: entrypoint.sh copies it to /home/dev/.ssh with correct modes
      - type: bind
        source: ${DEVBOX_SSH_DIR:-~/.ssh}
        target: /tmp/host-ssh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DEVBOX_GITCONFIG:-~/.gitconfig}
        target: /home/dev/.gitconfig
        read_only: true
        bind:
          create_host_path: false
      # host ~/.claude/CLAUDE.md, linked into ~/.claude by entrypoint.sh; `devbox up` points it at the
      # real file when it exists, otherwise this empty placeholder is mounted and ignored
      - type: bind
        source: ${DEVBOX_CLAUDE_MD:-./docker/empty-claude.md}
        target: /etc/devbox/host-claude.md
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

# explicit names: no compose project prefix, shared with `devbox shell`
volumes:
  devbox-home:
    name: devbox-home
  devbox-cargo:
    name: devbox-cargo
  devbox-rustup:
    name: devbox-rustup
  devbox-go:
    name: devbox-go
  devbox-uv-cache:
    name: devbox-uv-cache
  devbox-pnpm-store:
    name: devbox-pnpm-store
